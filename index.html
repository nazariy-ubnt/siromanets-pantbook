<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сіроманець — інтерактивний пантбук</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=Yeseva+One&family=Noto+Sans:wght@400;700&display=swap');

  :root{
    --bg-primary:#1c1130;
    --bg-panel:#2a1b47;
    --bg-panel-soft:#251841;
    --line-soft: rgba(246,231,180,.16);
    --line-soft-2: rgba(246,231,180,.08);
    --text-primary:#f6e7b4;
    --text-muted:#c9b98a;
    --text-dim:#a4936a;
    --accent-gold:#e8c468;
    --accent-gold-bright:#ffe08a;
    --accent-danger:#c17a5f;
    --accent-cool:#a9c2d1;
    --radius:18px;
    --font-display:'Yeseva One', Georgia, serif;
    --font-body:'Noto Sans','PT Sans',system-ui,sans-serif;
    --font-mono:'PT Mono', monospace;
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:400; margin:0 0 .4em; }
  p{ margin:0 0 .9em; }
  ::selection{ background:var(--accent-gold); color:#1c1130; }

  a{ color:var(--accent-gold-bright); }

  /* ---------- page wrapper (gets blurred behind modal) ---------- */
  #page{ transition: filter .5s var(--ease); }
  body.modal-open #page{ filter: blur(14px) brightness(.55); pointer-events:none; }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    padding: 32px 20px 64px;
  }
  .hero__bg{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-template-areas:
      "a1 a1 b  b  g  g"
      "a2 a2 b  b  g  g"
      "a2 a2 e  f  h  h"
      "d  d  e  f  h  h";
    gap:3px;
    background:var(--bg-primary);
  }
  .hero__tile{ position:relative; overflow:hidden; background:var(--bg-panel); margin:0; }
  .hero__tile img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;

      /* початково трохи затемнено */
      filter:
          brightness(.55)
          contrast(1.05)
          saturate(.75);

      transform:scale(1.03);
      transition:
          transform 1.6s var(--ease),
          filter 1.6s var(--ease);
  }

  .hero__tile::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
          155deg,
          rgba(42,27,71,.5),
          rgba(20,11,36,.78)
      );
      mix-blend-mode:multiply;
      box-shadow:inset 0 0 40px rgba(0,0,0,.45);
      pointer-events:none;
      transition:opacity 1.6s var(--ease);
  }

  /* коли наводиш на hero */
  .hero:hover .hero__tile img{
      transform:scale(1.08);

      /* повністю природні кольори */
      filter:
          brightness(1)
          contrast(1)
          saturate(1);
  }

  /* і прибрати фіолетове затемнення */
  .hero:hover .hero__tile::after{
      opacity:0;
  }
  .tile-a1{ grid-area:a1; }
  .tile-a2{ grid-area:a2; }
  .tile-b { grid-area:b; }
  .tile-d { grid-area:d; }
  .tile-e { grid-area:e; }
  .tile-f { grid-area:f; }
  .tile-g { grid-area:g; }
  .tile-h { grid-area:h; }

  /* ---- scrapbook accents on a few tiles ---- */
  .tile-deco{
    position:absolute; z-index:3; pointer-events:none;
    filter: drop-shadow(0 2px 3px rgba(10,6,18,.55));
  }
  .tile-deco--twig-a{ width:64px; height:64px; top:-16px; right:-12px; opacity:.92; }
  .tile-deco--twig-b{ width:50px; height:50px; bottom:-10px; left:-8px; opacity:.88; transform:rotate(150deg) scaleX(-1); }
  .tile-deco--twig-c{ width:42px; height:42px; top:-8px; left:-8px; opacity:.85; transform:rotate(-40deg); }
  .tile-deco--paw{ width:24px; height:24px; bottom:10px; right:10px; opacity:.7; }
  .tile-tape{
    position:absolute; z-index:3; top:-8px; left:20px;
    width:64px; height:22px;
    background:linear-gradient(180deg, rgba(246,231,180,.8), rgba(232,196,104,.58));
    border:1px solid rgba(255,247,220,.55);
    box-shadow:0 3px 8px rgba(0,0,0,.4);
    transform:rotate(-6deg);
  }
  .tile-stitch{
    position:absolute; z-index:3; inset:9px;
    border:1.5px dashed rgba(246,231,180,.55);
    border-radius:3px;
    pointer-events:none;
  }
  .hero__scrim{
    position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(58% 48% at 50% 56%, rgba(18,10,32,.92) 0%, rgba(18,10,32,.68) 45%, rgba(18,10,32,.3) 72%, rgba(18,10,32,.08) 100%),
      linear-gradient(180deg, rgba(18,10,32,.45) 0%, rgba(18,10,32,.15) 30%, rgba(18,10,32,.35) 65%, rgba(18,10,32,.82) 100%);
  }
  @media (max-width:640px){
    .hero__bg{
      grid-template-columns: repeat(2,1fr);
      grid-template-rows: repeat(9,1fr);
      grid-template-areas:
        "a1 a1"
        "a2 b"
        "a2 b"
        "d  d"
        "e  f"
        "e  f"
        "g  g"
        "g  g"
        "h  h";
    }
    .tile-deco--twig-a{ width:46px; height:46px; }
    .tile-deco--twig-b{ width:38px; height:38px; }
  }
  .hero__content{ position:relative; z-index:2; max-width:720px; }
  .hero__eyebrow{
    font-family:var(--font-mono);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:.72rem;
    color:var(--text-muted);
    margin-bottom:18px;
  }
  .hero__title{
    font-size:clamp(2.6rem, 9vw, 5.2rem);
    color:var(--text-primary);
    text-shadow: 0 0 40px rgba(232,196,104,.25);
    margin-bottom:6px;
    letter-spacing:.01em;
  }
  .hero__subtitle{
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    color:var(--text-muted);
    margin-bottom:2px;
  }
  .hero__author{
    font-size:.95rem;
    color:var(--text-dim);
    font-style:italic;
    margin-bottom:28px;
  }
  .hero__scrollcue{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:.75rem;
    letter-spacing:.1em;
    color:var(--text-dim);
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .hero__scrollcue svg{ width:16px; height:16px; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

  @media (prefers-reduced-motion: reduce){
    .hero__scrollcue svg{ animation:none !important; }
    .hero__tile img{ transition:none !important; }
    html{ scroll-behavior:auto; }
  }

  /* ---------- RUBRICS SECTION ---------- */
  .rubrics{
    max-width:1080px;
    margin:0 auto;
    padding: 20px 24px 90px;
  }
  .rubrics__intro{
    text-align:center;
    max-width:560px;
    margin:0 auto 40px;
    color:var(--text-muted);
    font-size:.98rem;
  }
  .rubrics__intro strong{ color:var(--text-primary); }

  .rubrics__grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:22px;
  }

  .rubric-card{
    position:relative;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(232,196,104,.08), transparent 55%),
      var(--bg-panel);
    border:1px solid var(--line-soft);
    border-radius: 10px 22px 12px 24px;
    padding:26px 22px 22px;
    text-align:left;
    color:var(--text-primary);
    font-family:var(--font-body);
    cursor:pointer;
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  }
  .rubric-card:nth-child(2n){ border-radius: 22px 10px 24px 12px; }
  .rubric-card:nth-child(3n){ border-radius: 14px 20px 20px 14px; }
  .rubric-card::before{
    content:"";
    position:absolute; top:-7px; left:26px;
    width:14px; height:14px; border-radius:50%;
    background: var(--accent-gold);
    box-shadow:0 0 10px rgba(232,196,104,.6);
    opacity:.85;
  }
  .rubric-card:hover, .rubric-card:focus-visible{
    transform:translateY(-6px);
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(232,196,104,.25);
    border-color: rgba(232,196,104,.4);
  }
  .rubric-card:focus-visible{ outline: 2px solid var(--accent-gold-bright); outline-offset:3px; }
  .rubric-card__icon{
    width:38px; height:38px;
    color:var(--accent-gold);
    margin-bottom:14px;
  }
  .rubric-card__icon svg{ width:100%; height:100%; }
  .rubric-card__title{
    font-family:var(--font-display);
    font-size:1.28rem;
    margin-bottom:8px;
    color:var(--text-primary);
  }
  .rubric-card__teaser{
    font-size:.88rem;
    color:var(--text-muted);
    margin:0;
  }
  .quote-glyph{
    font-family:var(--font-display);
    font-size:2.4rem;
    line-height:.6;
    color:var(--accent-gold);
    display:block;
    margin-bottom:6px;
  }

  footer.sitefoot{
    text-align:center;
    padding: 26px 20px 40px;
    color:var(--text-dim);
    font-size:.78rem;
    font-family:var(--font-mono);
  }

  /* ---------- OVERLAY / MODAL ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:flex-start; justify-content:center;
    padding: 40px 16px;
    overflow-y:auto;
    background: rgba(12,7,22,.55);
    opacity:0; pointer-events:none;
    transition: opacity .35s var(--ease);
  }
  .overlay.active{ opacity:1; pointer-events:auto; }
  .overlay__panel{
    position:relative;
    width:100%; max-width:760px;
    background: linear-gradient(180deg, var(--bg-panel-soft), var(--bg-panel));
    border:1px solid var(--line-soft);
    border-radius:20px;
    padding: 40px 30px 34px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    transform: translateY(18px) scale(.98);
    transition: transform .4s var(--ease);
    margin: 20px auto;
  }
  .overlay.active .overlay__panel{ transform: translateY(0) scale(1); }
  .overlay__close{
    position:absolute; top:16px; right:16px;
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line-soft);
    background:rgba(246,231,180,.05);
    color:var(--text-primary);
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .25s, transform .25s;
  }
  .overlay__close:hover{ background:rgba(246,231,180,.15); transform:rotate(90deg); }

  .sec-eyebrow{
    font-family:var(--font-mono);
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.7rem;
    color:var(--accent-gold);
    margin-bottom:10px;
  }
  .sec-title{ font-size:1.9rem; margin-bottom:6px; }
  .sec-sub{ color:var(--text-muted); font-size:.92rem; margin-bottom:26px; }

  /* visitka */
  .info-grid{ display:grid; grid-template-columns: 140px 1fr; gap:10px 16px; margin-bottom:22px; }
  .info-grid dt{ font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; padding-top:2px;}
  .info-grid dd{ margin:0; color:var(--text-primary); }
  .info-block{
    background: rgba(246,231,180,.04);
    border:1px solid var(--line-soft-2);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .info-block h3{ font-size:1.02rem; color:var(--accent-gold-bright); margin-bottom:6px; font-family:var(--font-body); font-weight:700;}
  .info-block p{ font-size:.94rem; color:var(--text-muted); margin:0; }

  .collage-heading{ text-align:center; }
  .collage-grid{
    display:flex;
    justify-content:center;
    margin-top:14px;
  }
  .collage-tile{
    position:relative;
    display:block;
    width:240px;
    max-width:70%;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    background:
      linear-gradient(160deg, rgba(246,231,180,.07), rgba(246,231,180,.02));
    border:1px solid var(--line-soft-2);
    box-shadow:0 4px 14px rgba(10,6,18,.35);
    cursor:pointer;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease);
  }
  .collage-tile:hover{
    transform:scale(1.03);
    box-shadow:0 10px 28px rgba(10,6,18,.5);
  }
  .collage-tile:focus-visible{
    outline:2px solid var(--accent-gold-bright);
    outline-offset:3px;
  }
  .collage-tile img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.88) saturate(.9);
    transform:scale(1.02);
    transition:transform .6s var(--ease), filter .6s var(--ease);
  }
  .collage-tile:hover img{
    transform:scale(1.08);
    filter:brightness(1) saturate(1.02);
  }
  @media (max-width:640px){
    .collage-tile{ width:200px; }
  }
  .footer-note{
    margin: 18px 0 4px;
    font-family:var(--font-mono);
    font-size:.7rem;
    letter-spacing:.04em;
    color:var(--text-dim);
    text-align:left;
  }

  /* characters */
  .char-card{
    background: rgba(246,231,180,.04);
    border:1px solid var(--line-soft-2);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .char-card h3{ font-size:1.15rem; color:var(--text-primary); margin-bottom:8px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip{
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.03em;
    padding:4px 11px;
    border-radius:20px;
    border:1px solid var(--line-soft);
    color:var(--text-muted);
  }
  .char-card.wolf .chip{ color:var(--accent-cool); border-color:rgba(169,194,209,.35); }
  .char-card.boy .chip{ color:var(--accent-gold-bright); border-color:rgba(232,196,104,.35); }
  .char-card.hunter .chip{ color:var(--accent-danger); border-color:rgba(193,122,95,.4); }
  .char-quote{ font-style:italic; color:var(--text-primary); font-size:.94rem; border-left:2px solid var(--accent-gold); padding-left:12px; margin:0; }
  .char-note{ font-size:.9rem; color:var(--text-muted); margin:0; }

  .relmap-wrap{ margin-top:26px; }
  .relmap-wrap svg{ width:100%; height:auto; }

  /* timeline */
  .timeline{ position:relative; padding-left:44px; margin-top:8px; }
  .timeline::before{
    content:""; position:absolute; left:19px; top:6px; bottom:6px; width:2px;
    background: linear-gradient(180deg, var(--accent-gold), rgba(232,196,104,.15));
  }
  .t-item{ position:relative; padding-bottom:22px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-marker{
    position:absolute; left:-44px; top:0;
    width:40px; height:40px;
    border-radius:50%;
    background: var(--bg-panel);
    border:1.5px solid var(--accent-gold);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:.78rem; color:var(--accent-gold-bright);
  }
  .t-text{ padding-top:8px; font-size:.94rem; color:var(--text-primary); }

  /* quotes */
  .quote-card{
    background: rgba(246,231,180,.04);
    border:1px solid var(--line-soft-2);
    border-radius:14px;
    padding:22px 22px 18px;
    margin-bottom:18px;
  }
  .quote-card .sec-eyebrow{ margin-bottom:8px; }
  .quote-card blockquote{
    margin:0 0 12px;
    font-family:var(--font-display);
    font-size:1.18rem;
    line-height:1.5;
    color:var(--text-primary);
  }
  .quote-card p{ font-size:.9rem; color:var(--text-muted); margin:0; }

  /* encyclopedia */
  .enc-block{ margin-bottom:20px; }
  .enc-block h3{ font-size:1.05rem; color:var(--accent-gold-bright); margin-bottom:8px; font-family:var(--font-body); font-weight:700; }
  .term-list{ display:grid; gap:10px; }
  .term{
    display:grid; grid-template-columns: 150px 1fr; gap:10px;
    font-size:.9rem;
    background: rgba(246,231,180,.03);
    border-radius:10px;
    padding:8px 12px;
  }
  .term b{ color:var(--accent-cool); font-family:var(--font-mono); font-weight:400; }
  .term span{ color:var(--text-muted); }
  .enc-block p{ font-size:.92rem; color:var(--text-muted); }

  /* reflection */
  .refl-field{ margin-bottom:22px; }
  .refl-label{ display:block; font-size:.85rem; color:var(--text-muted); margin-bottom:10px; font-family:var(--font-mono); letter-spacing:.02em; }
  .refl-text{ font-size:.95rem; color:var(--text-primary); line-height:1.6; margin:0; }

  .refl-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    position:relative;
    margin-bottom:6px;
    padding-bottom:8px;
  }
  .refl-toggle-row .refl-label{ margin-bottom:0; }
  .refl-hint-line{
    position:absolute;
    left:0; right:42px; bottom:-10px;
    height:18px;
    width:auto;
    pointer-events:none;
    overflow:visible;
    display:block;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 14px), transparent 100%);
  }
  .refl-toggle-btn{
    flex:0 0 auto;
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line-soft);
    background:rgba(246,231,180,.05);
    color:var(--accent-gold);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .25s var(--ease), box-shadow .25s var(--ease);
    position:relative;
    z-index:1;
  }
  .refl-toggle-btn:hover{ background:rgba(246,231,180,.15); box-shadow:0 0 12px rgba(232,196,104,.35); }
  .refl-toggle-icon{ width:15px; height:15px; transition: transform .35s var(--ease); }
  .refl-toggle-btn[aria-expanded="true"] .refl-toggle-icon{ transform: rotate(90deg); }
  .refl-toggle-row.is-open .refl-hint-line{ opacity:0; transition: opacity .3s var(--ease); }
  .refl-collapse{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .45s var(--ease);
  }
  .refl-collapse.open{ grid-template-rows: 1fr; }
  .refl-collapse-inner{ overflow:hidden; }
  .refl-collapse-inner p{
    padding-top:16px;
    font-size:.95rem;
    color:var(--text-primary);
    line-height:1.65;
    margin:0;
  }

  .star-rating{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .star{ width:24px; height:24px; flex:0 0 auto; }
  .star--full path{ fill:var(--accent-gold); }
  .star--half path{ fill:url(#reflStarGrad); }
  .star-score{ margin-left:8px; font-family:var(--font-mono); font-size:1rem; color:var(--accent-gold-bright); font-weight:700; }
  .star-outof{ color:var(--text-dim); font-weight:400; font-size:.85rem; }

  @media (max-width:640px){
    .overlay{ padding:0; align-items:stretch; }
    .overlay__panel{ border-radius:0; min-height:100%; margin:0; padding:56px 18px 40px; }
    .info-grid{ grid-template-columns: 110px 1fr; }
    .term{ grid-template-columns: 1fr; }
  }

body{overflow-x:hidden;}
svg text{font-family:'Noto Sans','PT Sans',sans-serif !important;}
.rubrics,.hero__content,.overlay__panel{max-width:min(95vw,900px);}
.overlay__panel{overflow-wrap:anywhere;}
blockquote,.t-text,.info-block p,.term span{hyphens:auto;word-break:normal;}
@media (max-width:768px){
.hero{padding:24px 16px 48px;}
.rubrics{padding:16px;}
.info-grid{grid-template-columns:1fr;}
.relmap-wrap svg text{font-size:11px!important;}
}

  .rubrics__grid{
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:28px;
  }

  .rubric-card{
    min-height:230px;
    padding:30px 24px 24px;
    display:flex;
    flex-direction:column;
  }

  .rubric-card__icon{
    width:34px;
    height:34px;
    color:var(--accent-gold);
    margin-bottom:16px;
    flex-shrink:0;
  }

  .rubric-card__icon svg{
    width:100%;
    height:100%;
  }

  .rubric-card__title{
    line-height:1.3;
    margin-bottom:10px;
  }

  const overlay = document.getElementById('overlay');
  const overlayPanel = document.getElementById('overlayPanel');
  const overlayContent = document.getElementById('overlayContent');
  const closeBtn = document.getElementById('closeBtn');
  let lastFocused = null;

  function openSection(key){
    const s = sections[key];
    if(!s) return;
    lastFocused = document.activeElement;
    overlayContent.innerHTML = `
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <h2 class="sec-title">${s.title}</h2>
      ${s.html}
    `;
    document.body.classList.add('modal-open');
    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden','false');
    overlayPanel.scrollTop = 0;
    overlay.scrollTop = 0;
    setTimeout(()=> closeBtn.focus(), 50);
    if(key === 'reflection') setupReflection();
  }

  function closeOverlay(){
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('modal-open');
    if(lastFocused) lastFocused.focus();
  }

  document.querySelectorAll('.rubric-card').forEach(btn=>{
    btn.addEventListener('click', ()=> openSection(btn.dataset.section));
  });

  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay(); });

  /* ---------- reflection toggle ---------- */
  function setupReflection(){
    const toggleBtn = document.getElementById('moodToggleBtn');
    const content = document.getElementById('moodToggleContent');
    const row = document.getElementById('moodToggleRow');
    if(!toggleBtn || !content) return;
    toggleBtn.addEventListener('click', ()=>{
      const isOpen = content.classList.toggle('open');
      toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      if(row) row.classList.toggle('is-open', isOpen);
    });
  }

})();
